@let request = pending();
@if (request) {
  <div class="dialog-backdrop" role="dialog" aria-modal="true">
    <div class="dialog confirm-dialog">
      <p>{{ request.message }}</p>
      <div class="dialog__actions">
        <button class="btn btn--secondary" (click)="respond(false)">Cancel</button>
        <button
          class="btn"
          [class.btn--danger]="request.danger"
          [class.btn--primary]="!request.danger"
          (click)="respond(true)"
        >{{ request.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
