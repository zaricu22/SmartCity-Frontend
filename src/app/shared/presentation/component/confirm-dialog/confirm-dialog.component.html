@if (pending()) {
  <div class="dialog-backdrop" role="dialog" aria-modal="true">
    <div class="dialog confirm-dialog">
      <p>{{ pending()!.message }}</p>
      <div class="dialog__actions">
        <button class="btn btn--secondary" (click)="respond(false)">Cancel</button>
        <button
          class="btn"
          [class.btn--danger]="pending()!.danger"
          [class.btn--primary]="!pending()!.danger"
          (click)="respond(true)"
        >{{ pending()!.confirmLabel }}</button>
      </div>
    </div>
  </div>
}
